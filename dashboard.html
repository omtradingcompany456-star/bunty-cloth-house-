<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunty Cloth House Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f5f5;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
background:#111827;
padding:20px;
}

.sidebar h2{
color:#D4AF37;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:10px;
border-radius:6px;
}

.sidebar a:hover{
background:#1f2937;
}

.main{
margin-left:250px;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:10px;
}

.section{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:6px;
}

button{
padding:12px 20px;
background:#D4AF37;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#111827;
color:white;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

.action-btn{
margin-right:5px;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>Bunty Admin</h2>

<a href="#">Dashboard</a>
<a href="#products">Products</a>
<a href="#orders">Orders</a>
<a href="admin.html">Logout</a>

</div>

<div class="main">

<h1>Admin Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Products</h3>
<h2 id="totalProducts">0</h2>
</div>

<div class="card">
<h3>Total Orders</h3>
<h2 id="totalOrders">0</h2>
</div>

<div class="card">
<h3>Pending Orders</h3>
<h2 id="pendingOrders">0</h2>
</div>

</div>
<!-- Product Section -->

<div class="section" id="products">

<h2>Add Product</h2>

<input
type="text"
id="name"
placeholder="Product Name"
>

<input
type="text"
id="category"
placeholder="Category"
>

<input
type="number"
id="price"
placeholder="Retail Price"
>

<input
type="number"
id="wholesalePrice"
placeholder="Wholesale Price"
>

<input
type="number"
id="stock"
placeholder="Stock Quantity"
>

<textarea
id="description"
placeholder="Product Description"
></textarea>

<label>Upload Images</label>

<input
type="file"
id="images"
multiple
accept="image/*"
>

<label>Upload Videos</label>

<input
type="file"
id="videos"
multiple
accept="video/*"
>

<button onclick="addProduct()">
Add Product
</button>

</div>

<!-- Products Table -->

<div class="section">

<h2>All Products</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Category</th>

<th>Price</th>

<th>Stock</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="productsTable">

</tbody>

</table>

</div>
<!-- Orders Section -->

<div class="section" id="orders">

<h2>Customer Orders</h2>

<table>

<thead>

<tr>

<th>Customer</th>
<th>Phone</th>
<th>City</th>
<th>Total</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

</div>

<!-- End Main Content -->

</div>

<script>

const PRODUCT_API =
"http://localhost:5000/api/products";

const ORDER_API =
"http://localhost:5000/api/orders";


// Load Products

async function loadProducts(){

try{

const res =
await fetch(PRODUCT_API);

const products =
await res.json();

document.getElementById(
"totalProducts"
).innerText =
products.length;

let html = "";

products.forEach(product=>{

html += `
<tr>

<td>${product.name}</td>

<td>${product.category}</td>

<td>₹${product.price}</td>

<td>${product.stock}</td>

<td>

<button
class="action-btn"
onclick="deleteProduct(
'${product._id}'
)">
Delete
</button>

</td>

</tr>
`;

});

document.getElementById(
"productsTable"
).innerHTML = html;

}catch(err){

console.log(err);

}

}


// Load Orders

async function loadOrders(){

try{

const res =
await fetch(ORDER_API);

const orders =
await res.json();

document.getElementById(
"totalOrders"
).innerText =
orders.length;

const pending =
orders.filter(
o => o.status === "Pending"
).length;

document.getElementById(
"pendingOrders"
).innerText =
pending;

let html = "";

orders.forEach(order=>{

html += `
<tr>

<td>${order.customerName}</td>

<td>${order.phone}</td>

<td>${order.city || "-"}</td>

<td>₹${order.orderTotal || 0}</td>

<td>${order.status}</td>

<td>

<button
class="action-btn"
onclick="
updateStatus(
'${order._id}',
'Confirmed'
)">
Confirm
</button>

<button
class="action-btn"
onclick="
updateStatus(
'${order._id}',
'Delivered'
)">
Deliver
</button>

<button
class="action-btn"
onclick="
deleteOrder(
'${order._id}'
)">
Delete
</button>

</td>

</tr>
`;

});

document.getElementById(
"ordersTable"
).innerHTML = html;

}catch(err){

console.log(err);

}

}
async function addProduct(){

try{

const product = {

name:
document.getElementById("name").value,

category:
document.getElementById("category").value,

price:
document.getElementById("price").value,

wholesalePrice:
document.getElementById(
"wholesalePrice"
).value,

stock:
document.getElementById(
"stock"
).value,

description:
document.getElementById(
"description"
).value,

images: [],

videos: []

};

await fetch(
PRODUCT_API,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(product)
}
);

alert(
"Product Added Successfully"
);

document.getElementById(
"name"
).value = "";

document.getElementById(
"category"
).value = "";

document.getElementById(
"price"
).value = "";

document.getElementById(
"wholesalePrice"
).value = "";

document.getElementById(
"stock"
).value = "";

document.getElementById(
"description"
).value = "";

loadProducts();

}catch(err){

console.log(err);

alert(
"Error Adding Product"
);

}

}



async function deleteProduct(id){

if(
!confirm(
"Delete this product?"
)
){
return;
}

try{

await fetch(
`${PRODUCT_API}/${id}`,
{
method:"DELETE"
}
);

loadProducts();

}catch(err){

console.log(err);

}

}



async function updateStatus(
id,
status
){

try{

await fetch(
`${ORDER_API}/${id}/status`,
{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
status
})
}
);

loadOrders();

}catch(err){

console.log(err);

}

}



async function deleteOrder(id){

if(
!confirm(
"Delete this order?"
)
){
return;
}

try{

await fetch(
`${ORDER_API}/${id}`,
{
method:"DELETE"
}
);

loadOrders();

}catch(err){

console.log(err);

}

}



// Initial Load

loadProducts();

loadOrders();

</script>

</body>
</html>
